spring:
  config:
    import: optional:file:.evn[.properties],optional:file:.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: manage-students
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=STManager;encrypt=true;trustServerCertificate=true
    username: sa
    password: 123456Aa
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: info

app:
  storage:
    avatars-subdir: data/uploads/avatars
    credentials-subdir: data/uploads/credentials
    insurances-subdir: data/uploads/insurances
    labor-contracts-subdir: data/uploads/labor-contracts
    research-works-subdir: data/uploads/research-works
  jwt:
    # Tối thiểu 32 byte cho HS256; đổi trong môi trường thật (biến môi trường / vault).
    secret: "dev-jwt-secret-change-me-32bytes-min!!"
    expiration-ms: 86400000
  gemini:
    # Khuyên dùng biến môi trường APP_GEMINI_API_KEY thay vì ghi trực tiếp vào file.
    api-key: ${APP_GEMINI_API_KEY:}
    model: ${APP_GEMINI_MODEL:gemini-3-flash-preview}
    base-url: ${APP_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  momo:
    enabled: ${APP_MOMO_ENABLED:false}
    partner-code: ${APP_MOMO_PARTNER_CODE:}
    access-key: ${APP_MOMO_ACCESS_KEY:}
    secret-key: ${APP_MOMO_SECRET_KEY:}
    endpoint: ${APP_MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    redirect-url: ${APP_MOMO_REDIRECT_URL:http://localhost:3000/user/tuition}
    ipn-url: ${APP_MOMO_IPN_URL:http://localhost:8080/api/v1/student-tuitions/payment-gateway/momo/ipn}
    request-type: ${APP_MOMO_REQUEST_TYPE:captureWallet}
    lang: ${APP_MOMO_LANG:vi}
  invoice:
    symbol: ${APP_INVOICE_SYMBOL:K26TAA}
    seller-name: ${APP_INVOICE_SELLER_NAME:TRUONG DAI HOC ST MANAGER}
    seller-tax-code: ${APP_INVOICE_SELLER_TAX_CODE:0109999999}
    seller-address: ${APP_INVOICE_SELLER_ADDRESS:Ha Noi, Viet Nam}
    vat-rate: ${APP_INVOICE_VAT_RATE:0.10}

